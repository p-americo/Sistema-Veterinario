#Fim do bloco original
# Conexao com o banco de dados PostgreSQL de producao
# A URL agora aponta para um host de producao e o usuario e especifico da app
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinicadb}}
spring.datasource.username=${DB_USER:postgres}

# Senha do banco de dados PostgreSQL
spring.datasource.password=${DB_PASSWORD:americo3}

# Configuracoes do JPA para producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desativado para nao poluir os logs de producao
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Key for JWT Token
# In a real application, this should stay out of the source code
# Use a long text string for security
api.security.token.secret=minha-chave-secreta-super-secreta-para-proteger-a-api-12345
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Configuracao do Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true
