name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/*/target/surefire-reports
          retention-days: 7

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-reports
          path: backend/*/target/site/jacoco
          retention-days: 7

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "### Cobertura JaCoCo por módulo"
            echo "| Módulo | Instruções | Branches |"
            echo "|---|---|---|"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              module=$(echo "$csv" | cut -d/ -f1)
              awk -F',' -v mod="$module" 'NR>1 {mi+=$4; ci+=$5; mb+=$6; cb+=$7} END {
                instr = (mi+ci) ? 100*ci/(mi+ci) : 100;
                branch = (mb+cb) ? 100*cb/(mb+cb) : 100;
                printf "| %s | %.1f%% | %.1f%% |\n", mod, instr, branch;
              }' "$csv"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate (mínimo de 50% por módulo e global)
        working-directory: backend
        run: |
          status=0

          echo "Verificando cobertura mínima de 50% por módulo:"
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            module=$(echo "$csv" | cut -d/ -f1)
            awk -F',' -v mod="$module" 'NR>1 {mi+=$4; ci+=$5} END {
              total = mi+ci;
              pct = total ? 100*ci/total : 0;
              printf "  %s: %.2f%%\n", mod, pct;
              if (pct < 50) exit 1;
            }' "$csv" || { echo "  FALHA: módulo $module está abaixo do limiar mínimo de 50%."; status=1; }
          done

          echo ""
          echo "Verificando cobertura global mínima de 50%:"
          awk -F',' '
            FNR>1 { mi+=$4; ci+=$5 }
            END {
              total = mi+ci;
              pct = total ? 100*ci/total : 0;
              printf "  Global: %.2f%%\n", pct;
              if (pct < 50) exit 1;
            }
          ' */target/site/jacoco/jacoco.csv || { echo "  FALHA: cobertura global está abaixo do limiar mínimo de 50%."; status=1; }

          exit $status
