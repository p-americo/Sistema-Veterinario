name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/*/target/surefire-reports
          retention-days: 7

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-reports
          path: backend/*/target/site/jacoco
          retention-days: 7

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          echo "### Cobertura JaCoCo por módulo" >> "$GITHUB_STEP_SUMMARY"
          echo "| Módulo | Instruções | Branches |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for csv in */target/site/jacoco/jacoco.csv; do
            module=$(echo "$csv" | cut -d/ -f1)
            awk -F',' -v mod="$module" 'NR>1 {mi+=$4; ci+=$5; mb+=$6; cb+=$7} END {
              instr = (mi+ci) ? 100*ci/(mi+ci) : 100;
              branch = (mb+cb) ? 100*cb/(mb+cb) : 100;
              printf "| %s | %.1f%% | %.1f%% |\n", mod, instr, branch;
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          done
