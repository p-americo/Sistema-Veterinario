# Configuracoes do H2 Database
spring.datasource.url=jdbc:h2:file:./target/testdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=validate

# Key for JWT Token
# In a real application, this should stay out of the source code
# Use a long text string for security
api.security.token.secret=minha-chave-secreta-super-secreta-para-proteger-a-api-12345


# Habilitando o Console do H2
spring.h2.console.enabled=true