<!-- Adicionamos [ngClass] ao container principal para aplicar a classe do tema -->
<div class="login-container" [ngClass]="{'admin-theme-container': tipoUsuarioSelecionado === 'admin'}">


  <div class="login-panel-left" [ngClass]="{'admin-theme-panel': tipoUsuarioSelecionado === 'admin'}">
    <img src="assets/images/logo.png" alt="VetManager Logo">
  </div>

  <div class="login-panel-right">
    <div class="login-form-container">


      <div class="user-type-selector">
        <button
          (click)="selecionarTipoUsuario('cliente')"
          [class.active]="tipoUsuarioSelecionado === 'cliente'">
          Cliente
        </button>
        <button
          (click)="selecionarTipoUsuario('admin')"
          [class.active]="tipoUsuarioSelecionado === 'admin'">
          Administrador
        </button>
      </div>

      <h2>Acesse sua conta</h2>

      <form (ngSubmit)="fazerLogin()">
        <div class="form-group">
          <label for="login">CPF</label>
          <input id="login" type="text" placeholder="Digite seu CPF" [(ngModel)]="login" name="login" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="Digite sua senha" [(ngModel)]="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar</button>
      </form>

      <div *ngIf="errorMessage" class="alert alert-danger" style="margin-top: 10px;">{{ errorMessage }}</div>

      <a href="#" class="forgot-password-link">Esqueceu a senha?</a>
    </div>
  </div>
</div>
