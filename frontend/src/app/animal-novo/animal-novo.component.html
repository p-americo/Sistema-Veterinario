<div class="form-container">
  <aside class="form-sidebar">
    <div class="photo-uploader" (click)="fileInput.click()" [class.has-preview]="!!imagemPreview">
      <img *ngIf="imagemPreview" [src]="imagemPreview" class="photo-preview" alt="Pré-visualização do pet">
      <div *ngIf="!imagemPreview" class="upload-placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="camera-icon">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span class="upload-text">Adicionar Foto</span>
      </div>
      <div *ngIf="imagemPreview" class="hover-overlay">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edit-icon">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"></path>
        </svg>
      </div>
    </div>
    
    <input type="file" hidden #fileInput (change)="onFileSelected($event)" accept="image/png, image/jpeg">
    
    <div class="sidebar-title">
      <span class="accent-title">Cadastrar</span>
      <h2 class="main-title">Novo Pet</h2>
    </div>
  </aside>

  <main class="form-main">
    <form [formGroup]="animalForm" (ngSubmit)="onSubmit()">
      <div class="field-grid grid-2">
        <div class="form-field">
          <label for="nome">Nome do Pet</label>
          <div class="input-wrapper">
            <input id="nome" type="text" formControlName="nome" placeholder="Ex: Bob, Mel...">
          </div>
        </div>
        <div class="form-field">
          <label for="raca">Raça</label>
          <div class="input-wrapper">
            <input id="raca" type="text" formControlName="raca" placeholder="Ex: Golden Retriever, SRD...">
          </div>
        </div>
      </div>

      <div class="field-grid grid-3">
        <div class="form-field">
          <label for="especie">Espécie</label>
          <div class="select-wrapper">
            <select id="especie" formControlName="especie">
              <option [ngValue]="null" disabled>Selecione</option>
              <option *ngFor="let item of listaEspecies" [value]="item">{{ item }}</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label for="porte">Porte</label>
          <div class="select-wrapper">
            <select id="porte" formControlName="porte">
              <option [ngValue]="null" disabled>Selecione</option>
              <option *ngFor="let item of listaPortes" [value]="item">{{ item }}</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label for="sexo">Sexo</label>
          <div class="select-wrapper">
            <select id="sexo" formControlName="sexo">
              <option [ngValue]="null" disabled>Selecione</option>
              <option *ngFor="let item of listaSexos" [value]="item">{{ item }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-grid grid-3 align-end">
        <div class="form-field">
          <label for="dataNascimento">Data de Nascimento</label>
          <div class="input-wrapper">
            <input id="dataNascimento" type="date" formControlName="dataNascimento">
          </div>
        </div>
        <div class="form-field">
          <label for="peso">Peso (kg)</label>
          <div class="input-wrapper">
            <input id="peso" type="number" formControlName="peso" placeholder="Ex: 10.5">
          </div>
        </div>
        <div class="form-field toggle-field">
          <span class="toggle-label">Castrado?</span>
          <label class="switch">
            <input id="castrado" type="checkbox" formControlName="castrado">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="form-field">
        <label for="observacao">Observações Clínicas / Cuidados Especiais</label>
        <div class="input-wrapper">
          <textarea id="observacao" formControlName="observacao" rows="4" placeholder="Ex: Alergias alimentares, restrições médicas, temperamento..."></textarea>
        </div>
      </div>

      <div class="actions-wrapper">
        <button type="button" class="cancel-button" (click)="onCancel()" [disabled]="isLoading">Cancelar</button>
        <button type="submit" class="submit-button" [disabled]="animalForm.invalid || isLoading">
          <span>{{ isLoading ? 'Salvando...' : 'Salvar Cadastro' }}</span>
        </button>
      </div>

      <div *ngIf="successMessage" class="toast success-toast">
        <div class="toast-icon">✓</div>
        <span>{{ successMessage }}</span>
      </div>
      <div *ngIf="errorMessage" class="toast error-toast">
        <div class="toast-icon">⚠</div>
        <span>{{ errorMessage }}</span>
      </div>
    </form>
  </main>
</div>
